services:
  # Backend API Web Service
  - type: web
    name: smartsports-api
    runtime: docker
    dockerfilePath: backend/SmartSports.Api/Dockerfile
    dockerContext: backend/SmartSports.Api
    plan: free
    region: singapore # Matches your Neon DB region (ap-southeast-1) for lowest latency
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string here in the Render dashboard
      - key: JWT_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: SmartSports.Api
      - key: JWT_AUDIENCE
        value: SmartSports.Client
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ENABLE_SWAGGER
        value: "true"
      # --- Email Delivery Configuration ---
      # Option 1: Resend HTTP API (RECOMMENDED for Render Free tier - Render blocks outbound SMTP ports 25, 465, and 587)
      - key: RESEND_API_KEY
        sync: false # Get a free API key from https://resend.com
      # Option 2: Direct SMTP (Works on Render Paid plans or custom mail servers)
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false # e.g. youraccount@gmail.com
      - key: SMTP_USER
        sync: false # e.g. youraccount@gmail.com
      - key: SMTP_PASSWORD
        sync: false # 16-character Google App Password (not standard account password)
      - key: SMTP_FROM_NAME
        value: "MySpot Sports"
      - key: REQUIRE_REAL_EMAIL
        value: "true"
      - key: ALLOW_DEV_OTP_FALLBACK
        value: "false"
