version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain ASP.NET backend NuGet packages
  - package-ecosystem: "nuget"
    directory: "/backend/SmartSports.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/backend/SmartSports.Api.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain React web npm packages
  - package-ecosystem: "npm"
    directory: "/web/smart-sports-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Flutter mobile pub packages
  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
